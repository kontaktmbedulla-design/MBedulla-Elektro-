<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Semi Condensed',system-ui,sans-serif;margin:0}
header{background:var(--head);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .in{max-width:900px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stripe{height:5px;background:repeating-linear-gradient(90deg,var(--earth1) 0 18px,var(--earth2) 18px 36px)}
.logo{font:700 21px 'Barlow Semi Condensed',sans-serif;letter-spacing:.3px}
.lang button{background:transparent;color:#cfd8e0;border:1px solid #3a4a58;padding:4px 9px;border-radius:6px;font:600 12px Barlow;cursor:pointer}
.lang button.on{background:#fff;color:#14202b;border-color:#fff}
main{max-width:900px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:18px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px;font-weight:500}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}

.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 15px Barlow;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.red{background:var(--stop)}
#app>*{min-width:0}.card{overflow-x:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock{text-align:center;padding:22px 16px}
.timer{font:700 56px/1 'Barlow Semi Condensed',sans-serif;font-variant-numeric:tabular-nums;margin:6px 0}
.big{width:100%;max-width:340px;padding:16px;font:700 22px 'Barlow Semi Condensed',sans-serif;border-radius:10px;border:0;color:#fff;cursor:pointer;background:var(--go)}
.big.stop{background:var(--stop)}
.mute{color:var(--mute);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.pill.on{background:var(--go);color:#fff;border-color:var(--go)}
.task{border-left:4px solid var(--earth1);background:var(--bg);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:8px}
.task.done{opacity:.55;border-left-color:var(--earth2);text-decoration:line-through}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:8px 6px}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none!important}
@media print{header,.noprint,.tabs{display:none!important}body{background:#fff;color:#000}.card{border:0}}
#docov{--ink:#14202b;--mute:#5b6b7a;--line:#d5dce3;--card:#fff;--bg:#f3f5f7;position:fixed;inset:0;z-index:20;background:#fff;color:#14202b;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
.docbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pdoc{max-width:760px;margin:auto;font-size:14px}.pdoc table{margin:16px 0}.pdoc hr{border:0;border-top:1px solid #ccc;margin:14px 0}
@page{size:A4;margin:12mm}
@media print{body.pdoc-on main{display:none!important}#docov{position:static;overflow:visible;padding:0}}

const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const zone=(p,g)=>{const s=siteOf(p);if(!g||!s||s.lat==null)return{ok:null,d:null};const d=Math.round(dist(g,s));return{ok:d<=s.r,d}};
const zoneTxt=(ok,d,g)=>ok===true?'✔ '+t('inZone')+' ('+d+' m)':ok===false?'⚠ '+t('outZone')+' ('+d+' m)':g?'✔ '+t('gpsOk'):'⚠ '+t('gpsNo');

function langBar(){$('lang').innerHTML=['sq','de','en'].map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join(' ');document.documentElement.lang=lang;if(SBs)$('lang').innerHTML+=`<span id="sbst" style="color:#fff;font-size:11px;margin-left:8px">${sbErr?'⚠ '+esc(sbErr):'● '+t('sbSyncOk')}</span>`}

function loginView(){return `<div style="max-width:420px;margin:18px auto 0;width:100%;text-align:center"><img src="${(C().logo)||DEF_LOGO}" alt="MBedulla-Elektro" style="max-height:90px;max-width:70%"><div style="font-weight:700;font-size:20px;margin-top:4px">ElektroTrack Pro</div><div class="mute">MBedulla-Elektro · Hilden</div></div><section class="card" style="max-width:420px;margin:14px auto;width:100%"><h2 style="font-size:26px">${t('signin')}</h2><p class="mute">${t('pick')}</p>
<form onsubmit="doLogin(event)"><label>${t('email')}</label><input id="le" type="email" autocomplete="username" required value="${esc(ui.lastEmail||'')}">
<label>${t('password')}</label><input id="lp" type="password" autocomplete="current-password" required>
<p id="lerr" class="mute" style="color:var(--stop);min-height:20px;margin:8px 0" role="alert"></p>
<button class="btn" style="width:100%">${t('enter')}</button></form>${sbOn()&&!sbSetupMode()?'':sbOn()?`<p class="mute" style="margin-top:14px">● ${t('sbOnMsg')}</p>`:`<p class="mute" style="margin-top:14px">${t('demoCreds')}</p><p class="mute">${t('demoNote')}</p>`}${!sbOn()||sbSetupMode()?`<p style="margin-top:10px"><button type="button" class="btn ghost sm" onclick="ui.sbcfg=!ui.sbcfg;render()">⚙ ${t('sbSet')}</button></p>${ui.sbcfg?sbCfgForm():''}`:''}</section><section class="card" style="max-width:420px;margin:0 auto 24px;width:100%"><h3>${t('lpHow')}</h3><ol style="padding-left:20px;margin:0 0 10px"><li>${t('lp1')}</li><li>${t('lp2')}</li><li>${t('lp3')}</li></ol><p class="mute">📲 ${t('lpInst')}</p><p class="mute">${t('lpHelp')}</p></section>`}
async function H(key,pw){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('et|'+key+'|'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function init(){if(sbOn()){S=sbFresh();ui.screen='login';render();await sbResume();return}
 if(!S.offers)S.offers=[];if(!S.invoices)S.invoices=[];if(!S.cfg)S.cfg={lat:null,lng:null,factor:1.3};if(S.cfg.breakMin==null)S.cfg.breakMin=60;if(!S.requests)S.requests=[];if(!S.sites)S.sites=PROJECTS.map((n,i)=>({id:i+1,name:n,lat:null,lng:null,r:150}));if(!S.admin)S.admin={email:'admin@elektro.com'};if(!S.admin.pw)S.admin.pw=await H('admin','admin123');for(const w of S.workers)if(!w.pw)w.pw=await H('w'+w.id,'123456');persist();render()}
async function doLogin(e){e.preventDefault();const em=$('le').value.trim().toLowerCase(),pw=$('lp').value;if(sbOn())return sbLogin(em,pw);ui.lastEmail=em;ui.admin=false;let acc=null,mgr=false;
 if(S.admin.email===em&&S.admin.pw===await H('admin',pw)){mgr=true;ui.admin=true}
 else{acc=S.workers.find(w=>w.email.toLowerCase()===em);if(acc&&acc.pw===await H('w'+acc.id,pw)){if(acc.role==='Manager')mgr=true}else acc=null}
 if(!mgr&&!acc){$('lerr').textContent=t('loginErr');$('lp').value='';return}
 if(mgr){ui.screen='manager';ui.tab='live'}else{ui.screen='worker';ui.uid=acc.id}
 render();startTick()}
async function resetPw(id){const w=S.workers.find(x=>x.id===id);if(!w)return;const p=prompt(t('newPw')+' — '+w.name);if(p===null)return;if(p.length<6){alert(t('pwShort'));return}if(sbOn()){try{await sbFn({action:'update',wid:id,password:p});alert(t('pwSaved'))}catch(e){alert(e.message)}return}w.pw=await H('w'+w.id,p);persist();alert(t('pwSaved'))}
async function setAdminPw(){const p=$('ap').value;if(p.length<6){alert(t('pwShort'));return}if(sbOn()){try{await sbReq('/auth/v1/user',{method:'PUT',body:{password:p}});$('ap').value='';alert(t('pwSaved'))}catch(e){alert(e.message)}return}S.admin.pw=await H('admin',p);persist();$('ap').value='';alert(t('pwSaved'))}
function logout(){if(sbOn()){sbLogout();return}ui.screen='login';ui.edit=null;render()}

/* WORKER */
function workerView(){const w=S.workers.find(x=>x.id===ui.uid);if(!w){logout();return ''}
 const act=active(w.id),td=today(),mo=td.slice(0,7);
 const tasks=S.tasks.filter(k=>k.wid===w.id&&k.date===td),mats=S.materials.filter(m=>m.wid===w.id&&m.date===td);
 const hT=sumH(w.id,s=>dkey(s.start)===td),hM=sumH(w.id,s=>dkey(s.start).slice(0,7)===mo);
 return `<section class="card between"><div><h3 style="margin:0">${esc(w.name)}</h3><div class="mute">${roleName(w.role)}</div><span class="pill ${act?'on':''}">${act?t('onSite'):t('off')}</span></div><button class="btn ghost sm" onclick="logout()">${t('logout')}</button></section>
<section class="card clock"><div class="mute">${act?esc(act.project)+' · '+zoneTxt(act.ok,act.dist,act.gps)+'<br>'+navLink(siteOf(act.project)):t('running').replace('…','')}</div>
<div class="timer" id="timer">${act?clockStr(Date.now()-act.start):'00:00:00'}</div>
${act?`<div class="mute" style="margin-bottom:4px">${t('autoBreak')}: <b>${brkMin()} min</b></div><div class="mute" id="netp" style="margin-bottom:10px"></div>`:`<div style="max-width:340px;margin:0 auto 12px;text-align:left"><label>${t('project')}</label><select id="proj" onchange="navUpd()">${siteNames().map(p=>`<option>${esc(p)}</option>`).join('')}</select><div id="navl" style="margin-top:8px">${navLink(S.sites[0])}</div></div>`}
<button class="big ${act?'stop':''}" onclick="toggleWork()">${act?'■ '+t('stop'):'▶ '+t('start')}</button></section>
<section class="row"><div class="card"><div class="mute">${t('today')}</div><div style="font:700 28px 'Barlow Semi Condensed'">${fmt(hT)}</div></div><div class="card"><div class="mute">${t('month')}</div><div style="font:700 28px 'Barlow Semi Condensed'">${fmt(hM)}</div></div></section>
<section class="card"><h3>${t('tasks')}</h3>${tasks.length?tasks.map(k=>`<div class="task ${k.done?'done':''}"><div class="between"><b>📍 ${esc(k.project)}</b>${k.done?'':`<button class="btn sm ghost" onclick="doneTask(${k.id})">✓ ${t('markDone')}</button>`}</div><div class="mute">${navLink(siteOf(k.project))}</div>${esc(k.text)}</div>`).join(''):`<p class="mute">${t('noTasks')}</p>`}</section>
${myHours(w)}
<section class="card"><h3>${t('materials')}</h3><div class="row"><input id="mn" placeholder="${esc(t('matName'))}" style="flex:3 1 160px"><input id="mq" placeholder="${esc(t('qty'))}" style="flex:1 1 80px"><button class="btn" style="flex:0 0 auto" onclick="addMat()">${t('add')}</button></div>
<ul class="plain">${mats.map(m=>`<li><span>${esc(m.name)}</span><b>${esc(m.qty)}</b></li>`).join('')}</ul></section>
<section class="card"><h3>${t('needTitle')}</h3><p class="mute" style="margin-top:-6px">${t('matHint')}</p><div class="row"><input id="rn" placeholder="${esc(t('matName'))}" style="flex:3 1 160px"><input id="rq" placeholder="${esc(t('qty'))}" style="flex:1 1 80px"></div><div class="row"><div><label>${t('project')}</label><select id="rp">${siteNames().map(p=>`<option>${esc(p)}</option>`).join('')}</select></div><div><label>${t('needBy')}</label><input id="rd" type="date" min="${today()}"></div></div><p><button class="btn" onclick="addReq()">${t('add')}</button></p>
<ul class="plain">${S.requests.filter(r=>r.wid===w.id).slice(-8).reverse().map(r=>`<li><span>${esc(r.name)} <span class="mute">· ${esc(r.qty)}${r.need?' · '+r.need:''}</span></span><span class="pill ${r.st==='delivered'?'on':''}">${stLabel(r.st)}</span></li>`).join('')}</ul></section>
<section class="card"><div class="mute" style="margin-bottom:8px">${t('contact')}</div><div class="row"><a class="btn ghost" style="text-align:center;text-decoration:none" href="https://wa.me/38344123456" target="_blank" rel="noopener">WhatsApp</a><a class="btn ghost" style="text-align:center;text-decoration:none" href="tel:+38344123456">${t('call')}</a></div></section>`}
function clockStr(ms){const s=Math.floor(ms/1000);return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':')}
function toggleWork(){const wid=ui.uid,act=active(wid);
 if(act){const brk=brkMin();const fin=g=>{const z=zone(act.project,g);act.end=Date.now();act.brk=brk;act.gpsOut=g;act.okOut=z.ok;act.distOut=z.d;persist();render()};
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>fin({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)}),()=>fin(null),{timeout:6000});else fin(null);return}
 const project=$('proj').value;
 const begin=gps=>{const z=zone(project,gps);S.sessions.push({id:newId(),wid,project,start:Date.now(),end:null,brk:brkMin(),gps,ok:z.ok,dist:z.d});persist();render()};
 if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>begin({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)}),()=>begin(null),{timeout:6000});
 else begin(null)}
const TASK_KEEP=21*864e5;
function purgeTasks(){const n=Date.now(),b=S.tasks.length;S.tasks.forEach(k=>{if(k.done&&!k.doneAt)k.doneAt=n});S.tasks=S.tasks.filter(k=>!(k.done&&n-k.doneAt>TASK_KEEP));if(S.tasks.length!==b)persist()}
function doneTask(id){const k=S.tasks.find(x=>x.id===id);if(k){k.done=true;k.doneAt=Date.now()}persist();render()}
function delTask(id){if(!ui.admin||!confirm(t('confirmTask')))return;S.tasks=S.tasks.filter(k=>k.id!==id);persist();render()}
function delDoneTasks(){if(!ui.admin||!confirm(t('confirmDelDone')))return;S.tasks=S.tasks.filter(k=>!k.done);persist();render()}
function addMat(){const name=$('mn').value.trim(),qty=$('mq').value.trim();if(!name||!qty)return;S.materials.push({id:newId(),wid:ui.uid,name,qty,date:today()});persist();render()}

/* MANAGER */
function managerView(){
 const openN=S.requests.filter(r=>r.st==='open').length;
 const tabs=[['live',t('live')],['mats',t('matsTab')+(openN?' ('+openN+')':'')],['team',t('team')],['sites',t('sites')],['tasks',t('tasksTab')],['sheet',t('sheet')],['acc',t('acc')]].concat(sbOn()&&sbLvl()>=2?[['inq',t('inq')+((ui.inq||[]).filter(q=>q.status==='new').length?' ('+(ui.inq||[]).filter(q=>q.status==='new').length+')':'')]]:[]).concat(ui.admin?[['fin',t('fin')]]:[]);
 let body=ui.tab==='live'?liveTab():ui.tab==='fin'&&ui.admin?finTab():ui.tab==='mats'?matsTab():ui.tab==='sites'?sitesTab():ui.tab==='team'?teamTab():ui.tab==='tasks'?tasksTab():ui.tab==='acc'?accTab():ui.tab==='inq'?inqTab():sheetTab();
 return `<section class="card between"><div><h2 style="font-size:24px">${t('manager')}</h2><span class="mute">${sbOn()?(SBp&&SBp.name?esc(SBp.name)+' · ':'')+t('sbOnMsg'):t('demoNote')}</span></div><button class="btn ghost sm" onclick="logout()">${t('logout')}</button></section>
<div class="tabs noprint">${tabs.map(([k,n])=>`<button class="btn ${ui.tab===k?'':'ghost'}" onclick="ui.tab='${k}';render()">${n}</button>`).join('')}</div>${body}
<section class="card noprint"><h3>${t('changePw')}</h3><div class="row"><input id="ap" type="password" autocomplete="new-password" placeholder="${esc(t('newPw'))}"><button class="btn" style="flex:0 0 auto" onclick="setAdminPw()">${t('save')}</button></div></section>
<p class="noprint mute"><a href="#" onclick="resetDemo();return false">${t('reset')}</a></p>`}
const brkMin=()=>S.cfg.breakMin==null?60:S.cfg.breakMin;
function netPrev(){const a=active(ui.uid),el=$('netp');if(a&&el)el.textContent=t('hours')+': '+fmt(Math.max(0,(Date.now()-a.start)/36e5-brkMin()/60))}
const kmOne=s=>S.cfg.lat==null||s.lat==null?null:dist(S.cfg,s)/1000*S.cfg.factor;
const kmCell=s=>{const k=kmOne(s);return k==null?'–':k.toFixed(1)+' km · ↔ '+(2*k).toFixed(1)+' km'};
function kmMonth(wid,m){const seen=new Set();let km=0;S.sessions.filter(s=>s.wid===wid&&s.end&&dkey(s.start).slice(0,7)===m).forEach(s=>{const k=dkey(s.start)+s.project;if(seen.has(k))return;seen.add(k);const x=kmOne(siteOf(s.project)||{});if(x)km+=2*x});return km}
function baseLoc(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{$('bla').value=p.coords.latitude.toFixed(5);$('bln').value=p.coords.longitude.toFixed(5)},()=>alert(t('gpsNo')),{timeout:8000})}
function saveBase(){const la=parseFloat($('bla').value),ln=parseFloat($('bln').value),ok=!isNaN(la)&&!isNaN(ln);S.cfg={lat:ok?la:null,lng:ok?ln:null,factor:Math.max(1,parseFloat($('bf').value)||1.3)};persist();render()}
const ST={draft:'oDraft',sent:'oSent',accepted:'oAccepted',rejected:'oRejected'};
const eur=n=>n.toFixed(2)+' €',fdt=ms=>new Date(ms).toLocaleString(lang,{dateStyle:'short',timeStyle:'short'}),fd=ms=>new Date(ms).toLocaleDateString(lang);
const nextNo=p=>{const k=p==='O'?'AN':'RN';S.cfg.seq=S.cfg.seq||{};if(!(S.cfg.seq[k]>0))S.cfg.seq[k]=260083;return 'MB-'+new Date().getFullYear()+'-'+k+'-'+(S.cfg.seq[k]++)};
function setOffer(id,st){const o=S.offers.find(x=>x.id===id);if(o)o.st=st;persist();render()}
function delOffer(id){if(S.invoices.some(i=>i.oid===id)||!confirm(t('confirmSite').replace(/\?$/,'?')))return;S.offers=S.offers.filter(o=>o.id!==id);persist();render()}
function delInv(id){if(!ui.admin||!confirm(t('confirmInv')))return;S.invoices=S.invoices.filter(i=>i.id!==id);persist();render()}
function payInv(id){const i=S.invoices.find(x=>x.id===id);if(i){i.st='paid';i.paid=Date.now()}persist();render()}
function saveCo(){readCo();persist();render()}
function setLogo(inp){const f=inp.files[0];if(!f||!f.type.startsWith('image/'))return;readCo();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{if(!im.width||!im.height)return;const k=Math.min(1,400/im.width,160/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.cfg.co.logo=c.toDataURL('image/png');persist();render()};im.src=r.result};r.readAsDataURL(f)}
function delLogo(){readCo();delete S.cfg.co.logo;persist();render()}
function tl(lg,k){const o=lang;lang=lg;const r=t(k);lang=o;return r}
const eurL=(n,lg)=>n.toLocaleString(lg==='en'?'en-GB':'de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fdL=(ms,lg)=>new Date(ms).toLocaleDateString(lg==='en'?'en-GB':'de-DE');
const lineSum=it=>Math.round((+it.q||0)*(+it.p||0)*100)/100;
const ltxt=it=>eur(lineSum(it));
const calc=(items,mode)=>{const r=x=>Math.round(x*100)/100,net=r(items.reduce((a,i)=>a+lineSum(i),0)),vat=mode==='19'?Math.round(net*19)/100:0;return{net,vat,gross:r(net+vat)}};

function itemSet(i,k,v){ui.inv.items[i][k]=v;updTot()}

 const ses=S.sessions.filter(s=>s.end&&inM(s)&&cwOk(s)).sort((a,b)=>b.start-a.start);
 return `<section class="card"><div class="between"><h3 style="margin:0">${t('sheet')}</h3><div class="row noprint" style="flex:0 1 auto"><input type="month" value="${m}" onchange="ui.month=this.value;render()"><button class="btn" onclick="showReport()">${t('export')}</button></div></div>
<div class="scroll"><table style="margin-top:10px"><tr><th>${t('worker')}</th><th>${t('hours')}</th><th>${t('rate')}</th><th>${t('cost')}</th><th>Km ↔</th></tr>${rows.map(r=>`<tr><td>${esc(r.w.name)}</td><td>${fmt(r.h)}</td><td>${r.w.rate} €</td><td>${r.c.toFixed(2)} €</td><td>${r.km.toFixed(1)} km</td></tr>`).join('')}<tr><td><b>${t('total')}</b></td><td><b>${fmt(tH)}</b></td><td></td><td><b>${tC.toFixed(2)} €</b></td><td><b>${rows.reduce((a,r)=>a+r.km,0).toFixed(1)} km</b></td></tr></table></div></section>
<section class="card"><div class="between"><h3 style="margin:0">${t('sheet')}</h3><select class="noprint" style="width:auto" onchange="ui.cw=this.value;render()"><option value="all">${t('all')}</option>${S.workers.map(w=>`<option value="${w.id}" ${ui.cw==w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div style="margin-top:10px">${calendar()}</div></section>
<section class="card noprint"><h3>${t('autoBreak')}</h3><div class="row"><div><label>${t('brk')}</label><input type="number" id="bk" min="0" value="${brkMin()}"></div><div style="flex:0 0 auto;align-self:end"><button class="btn" onclick="saveBrk(false)">${t('save')}</button> <button class="btn ghost" onclick="saveBrk(true)">${t('applyAll')}</button></div></div><p class="mute">${t('breakNote').replace('{n}',brkMin())}</p></section>
<section class="card"><h3>${t('sessions')}</h3>${ses.length?`<div class="scroll"><table><tr><th>${t('date')}</th><th>${t('worker')}</th><th>${t('project')}</th><th>${t('from')}–${t('to')}</th><th>${t('gross')}</th><th>${t('brk')}</th><th>${t('hours')}</th><th>GPS</th></tr>${ses.map(s=>`<tr><td>${dkey(s.start)}</td><td>${esc(wname(s.wid))}</td><td>${esc(s.project)}</td><td>${new Date(s.start).toTimeString().slice(0,5)}–${new Date(s.end).toTimeString().slice(0,5)}</td><td>${fmt((s.end-s.start)/36e5)}</td><td><input type="number" min="0" value="${s.brk||0}" style="width:72px" onchange="setBrk(${s.id},this.value)"> min</td><td><b>${fmt(net(s))}</b></td><td>${gpsMini(s.gps,s.ok,s.dist,t('ci'))}<br>${gpsMini(s.gpsOut,s.okOut,s.distOut,t('co'))}</td></tr>`).join('')}</table></div>`:`<p class="mute">${t('empty')}</p>`}</section>`}
function resetDemo(){S=seed();init()}

let tick;function startTick(){clearInterval(tick);tick=setInterval(()=>{document.querySelectorAll('[data-since]').forEach(x=>x.textContent=clockStr(Date.now()-x.dataset.since));netPrev();ui.tc=(ui.tc||0)+1;if(ui.screen==='manager'&&ui.tab==='live'&&ui.tc%5===0)render();const el=$('timer');if(el&&ui.screen==='worker'){const a=active(ui.uid);if(a)el.textContent=clockStr(Date.now()-a.start)}},1000)}
window.addEventListener('storage',e=>{if(sbOn()||e.key!==KEY||!e.newValue)return;try{S=JSON.parse(e.newValue)}catch(x){return}if(ui.screen==='manager'&&(ui.tab==='live'||ui.tab==='sheet'))render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
