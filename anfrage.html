<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anfrage – MBedulla-Elektro</title>
<style>
:root{--bg:#f3f8fb;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#cfdbe4;--brand:#1b5fa8;--sky:#8fd7f5;--ok:#1a7f45;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--sky);padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
header b{font-size:18px}.lang button{border:1px solid #fff8;background:#fff6;border-radius:8px;padding:5px 9px;font-weight:600;cursor:pointer}.lang .on{background:var(--ink);color:#fff}
main{max-width:640px;margin:18px auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:24px;margin:0 0 4px}p.mute{color:var(--mute);margin:0 0 14px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.two{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-weight:400;font-size:14px}.chk input{width:auto;margin-top:3px}
button.go{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:600 16px inherit;cursor:pointer}
button.go:disabled{opacity:.6}
.msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.msg.ok{display:block;background:#e6f4ec;color:var(--ok)}.msg.err{display:block;background:#fdecea;color:var(--bad)}
.hp{position:absolute;left:-5000px;height:0;overflow:hidden}
footer{margin-top:18px;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header><b>MBedulla-Elektro</b><div class="lang" id="lang"></div></header>
<main>
<div class="card">
<h1 id="t_h"></h1><p class="mute" id="t_sub"></p>
<form id="f" novalidate>
 <div class="two"><div><label id="t_name"></label><input id="name" maxlength="120" autocomplete="name"></div><div><label id="t_phone"></label><input id="phone" type="tel" maxlength="40" autocomplete="tel"></div></div>
 <label id="t_email"></label><input id="email" type="email" maxlength="160" autocomplete="email">
 <label id="t_addr"></label><input id="address" maxlength="300" autocomplete="street-address">
 <label id="t_kind"></label><select id="kind"></select>
 <label id="t_msg"></label><textarea id="message" maxlength="3000"></textarea>
 <label id="t_ph"></label><input id="photos" type="file" accept="image/*" multiple><div class="mute" id="t_phh" style="font-size:12px;margin-top:4px"></div>
 <div class="hp" aria-hidden="true"><label>Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
 <label class="chk"><input type="checkbox" id="consent"><span id="t_consent"></span></label>
 <button class="go" id="go" type="submit"></button>
 <div class="msg" id="msg" role="status"></div>
</form>
</div>
<footer id="t_foot"></footer>
</main>
<script>
// ===== EINSTELLUNG: hier Supabase-URL und "anon public"-Key eintragen (Project Settings → API). Der anon-Key ist öffentlich und darf hier stehen. =====
const SUPABASE_URL = 'https://gllgysoxlouaxlrloddm.supabase.co';          // z.B. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdsbGd5c294bG91YXhscmxvZGRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDQ5NjUsImV4cCI6MjEwODYyMDk2NX0.DNHs_PGM9jq50qZlwpo2C-CIaId6Oq6jWLvuk5tRQOk';     // eyJ...
const PRIVACY_URL = 'https://www.mbedulla-elektro.de/privacy-policy/';   // Link zu Ihrer Datenschutzerklärung
// ===========================================================================================================
const KINDS={de:['Elektroinstallation','Renovierung / Neubau','PV-Solaranlage','Smart Home','Sprech- / Türsprechanlage','Videoüberwachung','Netzwerk / Telefon / Satellit','Sonstiges'],
 sq:['Instalim elektrik','Rinovim / Ndërtim i ri','Sistem fotovoltaik (PV)','Smart Home','Zile / interfon','Kamera sigurie','Rrjet / telefon / satelit','Tjetër'],
 en:['Electrical installation','Renovation / new build','PV solar system','Smart home','Intercom / door entry','Video surveillance','Network / phone / satellite','Other']};
const T={
 de:{ph:'Fotos (optional, max. 4)',phh:'Nur für die Erstellung des Angebots. Bilder werden verkleinert hochgeladen.',pherr:'Fotos konnten nicht hochgeladen werden.',h:'Anfrage senden',sub:'Beschreiben Sie kurz Ihr Vorhaben. Wir melden uns so schnell wie möglich (Mo–Fr 7:00–17:00 Uhr).',name:'Name *',phone:'Telefon / WhatsApp',email:'E-Mail',addr:'Adresse des Objekts',kind:'Art der Arbeit',msg:'Ihre Nachricht *',consent:'Ich stimme zu, dass meine Angaben zur Bearbeitung der Anfrage gespeichert werden. Hinweise in der <a href="__P__" target="_blank" rel="noopener">Datenschutzerklärung</a>.',go:'Anfrage absenden',foot:'MBedulla-Elektro · Benrather Str. 18 · 40721 Hilden',ok:'Vielen Dank! Ihre Anfrage ist angekommen. Wir melden uns bei Ihnen.',contact:'Bitte Telefon oder E-Mail angeben.',req:'Bitte Name und Nachricht ausfüllen.',cons:'Bitte der Speicherung zustimmen.',err:'Das Senden hat nicht geklappt. Bitte per E-Mail oder WhatsApp melden: kontakt@mbedulla-elektro.de',cfg:'Formular noch nicht eingerichtet (Supabase-URL fehlt).'},
 sq:{ph:'Foto (opsionale, maks. 4)',phh:'Vetëm për përgatitjen e ofertës. Fotot zvogëlohen para ngarkimit.',pherr:'Fotot nuk u ngarkuan.',h:'Dërgo kërkesë',sub:'Përshkruaj shkurt punën që të duhet. Të përgjigjemi sa më shpejt (Hr–Pr 7:00–17:00).',name:'Emri *',phone:'Telefon / WhatsApp',email:'Email',addr:'Adresa e objektit',kind:'Lloji i punës',msg:'Mesazhi juaj *',consent:'Pranoj që të dhënat e mia të ruhen për përpunimin e kërkesës. Shih <a href="__P__" target="_blank" rel="noopener">Datenschutzerklärung</a>.',go:'Dërgo kërkesën',foot:'MBedulla-Elektro · Benrather Str. 18 · 40721 Hilden',ok:'Faleminderit! Kërkesa u pranua. Do t\'ju kontaktojmë.',contact:'Shkruaj telefon ose email.',req:'Plotëso emrin dhe mesazhin.',cons:'Duhet të pranosh ruajtjen e të dhënave.',err:'Dërgimi dështoi. Na shkruaj me email ose WhatsApp: kontakt@mbedulla-elektro.de',cfg:'Formulari nuk është konfiguruar (mungon URL e Supabase).'},
 en:{ph:'Photos (optional, max. 4)',phh:'Only used to prepare the quote. Images are resized before upload.',pherr:'Photos could not be uploaded.',h:'Send a request',sub:'Briefly describe your project. We reply as soon as possible (Mon–Fri 7:00–17:00).',name:'Name *',phone:'Phone / WhatsApp',email:'Email',addr:'Site address',kind:'Type of work',msg:'Your message *',consent:'I agree that my details are stored to process this request. See the <a href="__P__" target="_blank" rel="noopener">privacy policy</a>.',go:'Send request',foot:'MBedulla-Elektro · Benrather Str. 18 · 40721 Hilden',ok:'Thank you! Your request has arrived. We will get back to you.',contact:'Please give a phone number or email.',req:'Please fill in name and message.',cons:'Please agree to the storage of your data.',err:'Sending failed. Please email or WhatsApp us: kontakt@mbedulla-elektro.de',cfg:'Form not set up yet (Supabase URL missing).'}};
let lang=(localStorage.getItem('anfrage_lang')||((navigator.language||'de').slice(0,2)));if(!T[lang])lang='de';
const $=id=>document.getElementById(id),t0=Date.now();
function paint(){const x=T[lang];$('t_h').textContent=x.h;$('t_sub').textContent=x.sub;$('t_name').textContent=x.name;$('t_phone').textContent=x.phone;$('t_email').textContent=x.email;$('t_addr').textContent=x.addr;$('t_kind').textContent=x.kind;$('t_msg').textContent=x.msg;$('t_consent').innerHTML=x.consent.replace('__P__',PRIVACY_URL);$('go').textContent=x.go;$('t_ph').textContent=x.ph;$('t_phh').textContent=x.phh;$('t_foot').textContent=x.foot;document.documentElement.lang=lang;
 const cur=$('kind').selectedIndex;$('kind').innerHTML=KINDS[lang].map((k,i)=>`<option value="${KINDS.de[i]}">${k}</option>`).join('');if(cur>0)$('kind').selectedIndex=cur;
 $('lang').innerHTML=['de','sq','en'].map(l=>`<button type="button" class="${l===lang?'on':''}" onclick="lang='${l}';localStorage.setItem('anfrage_lang',lang);paint()">${l.toUpperCase()}</button>`).join(' ')}
function say(c,m){const e=$('msg');e.className='msg '+c;e.textContent=m}
$('f').addEventListener('submit',async e=>{e.preventDefault();const x=T[lang];say('','');
 if($('website').value||Date.now()-t0<2500)return;                       // honeypot / too fast = bot
 if(!SUPABASE_URL||!SUPABASE_ANON_KEY){say('err',x.cfg);return}
 const name=$('name').value.trim(),phone=$('phone').value.trim(),email=$('email').value.trim(),message=$('message').value.trim();
 if(name.length<2||message.length<5){say('err',x.req);return}
 if(!phone&&!email){say('err',x.contact);return}
 if(email&&!/^\S+@\S+\.\S+$/.test(email)){say('err',x.contact);return}
 if(!$('consent').checked){say('err',x.cons);return}

 $('go').disabled=true;
 const base=SUPABASE_URL.replace(/\/+$/,''),files=[...$('photos').files].filter(f=>/^image\//.test(f.type)).slice(0,4),paths=[];
 const shrink=f=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',0.8)};im.onerror=()=>{URL.revokeObjectURL(u);no()};im.src=u});
 try{for(const f of files){const b=await shrink(f),nm=crypto.randomUUID()+'.jpg',up=await fetch(base+'/storage/v1/object/inquiry-photos/'+nm,{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'image/jpeg'},body:b});if(!up.ok)throw new Error('photo '+up.status);paths.push(nm)}}
 catch(err){say('err',x.pherr);$('go').disabled=false;return}
 try{const r=await fetch(SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/inquiries',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
   body:JSON.stringify({name,phone,email,address:$('address').value.trim(),kind:$('kind').value,message,consent_at:new Date().toISOString(),photos:paths})});
  if(!r.ok)throw new Error(r.status);say('ok',x.ok);$('f').reset()}
 catch(err){say('err',x.err)}finally{$('go').disabled=false}});
paint();
</script>
</body>
</html>
