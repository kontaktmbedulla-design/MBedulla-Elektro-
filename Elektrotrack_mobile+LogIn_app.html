<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElektroTrack ⚡ - App për Elektroinstalues</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons për ikona të pastra -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.3);
    }
    .btn-pulse {
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(34, 197, 94, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }
    .btn-pulse-stop {
      animation: pulse-ring-red 2s infinite;
    }
    @keyframes pulse-ring-red {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-white">

  <!-- HEADER ME ZGJEDHJE GJUHE -->
  <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="bg-amber-500 text-slate-900 p-2 rounded-lg font-black text-xl flex items-center justify-center w-9 h-9">
          ⚡
        </div>
        <span class="font-extrabold text-lg tracking-tight text-amber-500">ElektroTrack</span>
      </div>

      <!-- Zgjedhësi i Gjuhëve -->
      <div class="flex gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
        <button onclick="changeLanguage('sq')" id="lang-sq" class="px-2 py-1 text-xs font-bold rounded transition-all bg-amber-500 text-slate-950">🇦🇱</button>
        <button onclick="changeLanguage('de')" id="lang-de" class="px-2 py-1 text-xs font-bold rounded transition-all text-slate-400 hover:text-white">🇩🇪</button>
        <button onclick="changeLanguage('en')" id="lang-en" class="px-2 py-1 text-xs font-bold rounded transition-all text-slate-400 hover:text-white">🇬🇧</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto w-full p-4 flex-grow flex flex-col justify-center">

    <!-- 1. SEKSIONI I LOGIN (Ekrani i Kyçjes) -->
    <section id="login-section" class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200">
      <div class="text-center mb-6">
        <h1 data-i18n="loginTitle" class="text-2xl font-black text-slate-900 mb-1">Kyçja në Sistem</h1>
        <p data-i18n="loginSubtitle" class="text-xs text-slate-500">Shkruani të dhënat tuaja për të vazhduar</p>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label data-i18n="emailLabel" class="block text-xs font-bold text-slate-700 uppercase mb-1">Email / Numri i Telefonit</label>
          <div class="relative">
            <i class="ph ph-user absolute left-3 top-3.5 text-slate-400 text-lg"></i>
            <input type="text" id="username" required value="agon.berisha@elektro.com" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 focus:bg-white transition-all font-medium">
          </div>
        </div>

        <div>
          <label data-i18n="passwordLabel" class="block text-xs font-bold text-slate-700 uppercase mb-1">Fjalëkalimi</label>
          <div class="relative">
            <i class="ph ph-lock-key absolute left-3 top-3.5 text-slate-400 text-lg"></i>
            <input type="password" id="password" required value="123456" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 focus:bg-white transition-all font-medium">
          </div>
        </div>

        <button type="submit" data-i18n="btnLogin" class="w-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-amber-500/30 transition-all text-sm uppercase tracking-wider flex items-center justify-center gap-2">
          <span>Kyçuni</span>
          <i class="ph ph-arrow-right font-bold"></i>
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center">
        <span class="text-xs text-slate-400">ElektroTrack App v2.4 • Demo Mode</span>
      </div>
    </section>

    <!-- 2. DASHBOARD I PUNËTORIT (I fshehur fillimisht) -->
    <section id="dashboard-section" class="hidden space-y-4">
      
      <!-- Kartela e Përdoruesit -->
      <div class="bg-slate-900 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 bg-amber-500 rounded-xl flex items-center justify-center text-slate-950 font-black text-lg">
            AB
          </div>
          <div>
            <h2 class="font-bold text-sm leading-tight text-slate-100">Agon Berisha</h2>
            <p data-i18n="workerRole" class="text-xs text-amber-400 font-medium">Elektroinstalues • On Duty</p>
          </div>
        </div>
        <button onclick="handleLogout()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded-xl transition-all" title="Logout">
          <i class="ph ph-sign-out text-xl"></i>
        </button>
      </div>

      <!-- Zgjedhja e Objektit (Baustelle) -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <label data-i18n="selectProject" class="block text-xs font-bold text-slate-700 uppercase mb-2">Zgjidh Objektin / Baustelle:</label>
        <div class="relative">
          <i class="ph ph-buildings absolute left-3 top-3.5 text-amber-500 text-lg"></i>
          <select id="projectSelect" class="w-full pl-10 pr-8 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:border-amber-500 appearance-none transition-all">
            <option value="Objekti Banesor - Rruga B">Objekti Banesor - Rruga B</option>
            <option value="Shtëpia e A. Berishës">Shtëpia e A. Berishës</option>
            <option value="Parku Fotovoltaik - Podujevë">Parku Fotovoltaik - Podujevë</option>
          </select>
          <i class="ph ph-caret-down absolute right-3 top-4 text-slate-400 text-xs pointer-events-none"></i>
        </div>
      </div>

      <!-- Butoni Kryesor Check-in / Check-out -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center flex flex-col items-center">
        <button id="mainBtn" onclick="toggleWork()" class="btn-pulse bg-emerald-500 hover:bg-emerald-600 text-white w-44 h-44 rounded-full font-black text-lg flex flex-col items-center justify-center gap-1 shadow-2xl transition-all active:scale-95">
          <i id="btnIcon" class="ph ph-play-circle text-5xl"></i>
          <span id="btnText" data-i18n="btnStart">FILLO PUNËN</span>
        </button>

        <!-- Statusi i GPS -->
        <div id="gpsStatusContainer" class="mt-4 flex items-center justify-center gap-2 text-xs font-semibold text-slate-500 bg-slate-50 py-2 px-4 rounded-full border border-slate-100">
          <span id="gpsDot" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
          <span id="gpsStatusText" data-i18n="gpsReady">📍 GPS: Gati për verifikim</span>
        </div>
      </div>

      <!-- DITAR PUNE & MATERIALET (Plotësohet gjatë punës ose në fund) -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h3 data-i18n="dailyLogTitle" class="font-bold text-sm text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2">
          <i class="ph ph-notebook text-amber-500 text-lg"></i>
          <span>Ditari i Punës & Materialet</span>
        </h3>

        <div>
          <label data-i18n="workDescriptionLabel" class="block text-xs font-semibold text-slate-600 mb-1">Përshkrimi i Punës së Bërë:</label>
          <textarea id="workNotes" rows="2" placeholder="Montimi i tablosë elektrike, shtrirja e kabllove..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-amber-500 transition-all"></textarea>
        </div>

        <div>
          <label data-i18n="materialsLabel" class="block text-xs font-semibold text-slate-600 mb-1">Materialet e Përdorura:</label>
          <div class="flex gap-2">
            <input type="text" id="materialInput" placeholder="p.sh. Kabllo 3x2.5 (50m)" class="flex-grow p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-amber-500">
            <button onclick="addMaterial()" class="bg-slate-900 text-white px-3 py-2.5 rounded-xl text-xs font-bold hover:bg-slate-800 active:scale-95 transition-all">
              + Shto
            </button>
          </div>
          <ul id="materialList" class="mt-2 space-y-1 text-xs text-slate-700">
            <!-- Materialet shtohen dinamikisht këtu -->
          </ul>
        </div>
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 text-center text-xs py-3 border-t border-slate-800">
    ElektroTrack ⚡ • Digital Work Log System
  </footer>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // State-i i Aplikacionit
    let currentLang = 'sq';
    let isWorking = false;
    let materials = [];

    // Fjalori i Përkthimeve (i18n)
    const translations = {
      sq: {
        loginTitle: "Kyçja në Sistem",
        loginSubtitle: "Shkruani të dhënat tuaja për të vazhduar",
        emailLabel: "Email / Numri i Telefonit",
        passwordLabel: "Fjalëkalimi",
        btnLogin: "Kyçuni",
        workerRole: "Elektroinstalues • Në Detyrë",
        selectProject: "Zgjidh Objektin / Baustelle:",
        btnStart: "FILLO PUNËN",
        btnStop: "MBYLL PUNËN",
        gpsReady: "📍 GPS: Gati për verifikim",
        gpsVerified: "🟢 Check-in i Verifikuar",
        dailyLogTitle: "Ditari i Punës & Materialet",
        workDescriptionLabel: "Përshkrimi i Punës së Bërë:",
        materialsLabel: "Materialet e Përdorura:",
        msgStart: "U regjistrua fillimi i punës në: ",
        msgStop: "Puna u mbyll me sukses!",
        msgGpsErr: "Ju lutem aktivizoni GPS në telefon!",
        noMaterialErr: "Shkruani emrin e materialit!"
      },
      de: {
        loginTitle: "System-Anmeldung",
        loginSubtitle: "Geben Sie Ihre Anmeldedaten ein",
        emailLabel: "E-Mail / Telefonnummer",
        passwordLabel: "Passwort",
        btnLogin: "Einloggen",
        workerRole: "Elektriker • Im Dienst",
        selectProject: "Baustelle auswählen:",
        btnStart: "ARBEIT STARTEN",
        btnStop: "ARBEIT BEENDEN",
        gpsReady: "📍 GPS: Bereit zur Verifizierung",
        gpsVerified: "🟢 Check-in Verifiziert",
        dailyLogTitle: "Bautagebuch & Material",
        workDescriptionLabel: "Beschreibung der Arbeiten:",
        materialsLabel: "Verwendetes Material:",
        msgStart: "Arbeitsbeginn registriert auf: ",
        msgStop: "Arbeit erfolgreich beendet!",
        msgGpsErr: "Bitte aktivieren Sie das GPS auf Ihrem Handy!",
        noMaterialErr: "Bitte Materialnamen eingeben!"
      },
      en: {
        loginTitle: "System Login",
        loginSubtitle: "Enter your credentials to continue",
        emailLabel: "Email / Phone Number",
        passwordLabel: "Password",
        btnLogin: "Sign In",
        workerRole: "Electrician • On Duty",
        selectProject: "Select Work Site / Project:",
        btnStart: "START WORK",
        btnStop: "STOP WORK",
        gpsReady: "📍 GPS: Ready for verification",
        gpsVerified: "🟢 Check-in Verified",
        dailyLogTitle: "Daily Log & Materials",
        workDescriptionLabel: "Work Description:",
        materialsLabel: "Materials Used:",
        msgStart: "Work started at: ",
        msgStop: "Work shift completed successfully!",
        msgGpsErr: "Please enable GPS on your phone!",
        noMaterialErr: "Please enter material name!"
      }
    };

    // Funksioni për ndërrimin e gjuhës
    function changeLanguage(lang) {
      currentLang = lang;

      // Përditëso butonat e flamujve
      ['sq', 'de', 'en'].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (l === lang) {
          btn.className = "px-2 py-1 text-xs font-bold rounded transition-all bg-amber-500 text-slate-950";
        } else {
          btn.className = "px-2 py-1 text-xs font-bold rounded transition-all text-slate-400 hover:text-white";
        }
      });

      // Ndërro të gjitha tekstet që kanë atributin data-i18n
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });

      // Ndërro tekstin e butonit kryesor nëse është në punë apo jo
      const btnText = document.getElementById('btnText');
      if (btnText) {
        btnText.innerText = isWorking ? translations[lang].btnStop : translations[lang].btnStart;
      }
    }

    // Trajtimi i Login-it
    function handleLogin(event) {
      event.preventDefault();
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
    }

    // Trajtimi i Logout-it
    function handleLogout() {
      if (isWorking) {
        alert(currentLang === 'sq' ? "Ju lutemi mbyllni orarin e punës para se të çkyçeni!" : "Bitte beenden Sie Ihre Schicht vor dem Ausloggen!");
        return;
      }
      document.getElementById('dashboard-section').classList.add('hidden');
      document.getElementById('login-section').classList.remove('hidden');
    }

    // Trajtimi i Check-in / Check-out me GPS
    function toggleWork() {
      const btn = document.getElementById('mainBtn');
      const btnIcon = document.getElementById('btnIcon');
      const btnText = document.getElementById('btnText');
      const gpsStatusText = document.getElementById('gpsStatusText');
      const gpsDot = document.getElementById('gpsDot');
      const projectSelect = document.getElementById('projectSelect');
      const t = translations[currentLang];

      if (!isWorking) {
        // Nisi Check-in
        if (navigator.geolocation) {
          gpsStatusText.innerText = "⏳ Po merret lokacioni GPS...";
          
          navigator.geolocation.getCurrentPosition((pos) => {
            isWorking = true;
            
            // Ndërro dizajnin e butonit në të Kuq (Stop)
            btn.className = "btn-pulse-stop bg-rose-500 hover:bg-rose-600 text-white w-44 h-44 rounded-full font-black text-lg flex flex-col items-center justify-center gap-1 shadow-2xl transition-all active:scale-95";
            btnIcon.className = "ph ph-stop-circle text-5xl";
            btnText.innerText = t.btnStop;

            // Statusi i GPS
            gpsDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
            gpsStatusText.innerText = `${t.gpsVerified} (${pos.coords.latitude.toFixed(3)}, ${pos.coords.longitude.toFixed(3)})`;
            gpsStatusText.className = "text-emerald-600 font-bold";

            // Blloko ndryshimin e projektit gjatë punës
            projectSelect.disabled = true;

            alert(`${t.msgStart} "${projectSelect.value}"`);
          }, () => {
            alert(t.msgGpsErr);
            gpsStatusText.innerText = t.gpsReady;
          });
        } else {
          alert(t.msgGpsErr);
        }
      } else {
        // Nisi Check-out
        isWorking = false;

        // Kthe dizajnin e butonit në të Gjelbër (Start)
        btn.className = "btn-pulse bg-emerald-500 hover:bg-emerald-600 text-white w-44 h-44 rounded-full font-black text-lg flex flex-col items-center justify-center gap-1 shadow-2xl transition-all active:scale-95";
        btnIcon.className = "ph ph-play-circle text-5xl";
        btnText.innerText = t.btnStart;

        // Reset GPS status
        gpsDot.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
        gpsStatusText.innerText = t.gpsReady;
        gpsStatusText.className = "text-slate-500 font-semibold";

        // Zhblloko zgjedhjen e projektit
        projectSelect.disabled = false;

        alert(t.msgStop);
      }
    }

    // Shtimi i Materialeve në Listë
    function addMaterial() {
      const input = document.getElementById('materialInput');
      const val = input.value.trim();
      const t = translations[currentLang];

      if (!val) {
        alert(t.noMaterialErr);
        return;
      }

      materials.push(val);
      renderMaterials();
      input.value = '';
    }

    function removeMaterial(index) {
      materials.splice(index, 1);
      renderMaterials();
    }

    function renderMaterials() {
      const list = document.getElementById('materialList');
      list.innerHTML = '';
      materials.forEach((mat, idx) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-200";
        li.innerHTML = `
          <span>• ${mat}</span>
          <button onclick="removeMaterial(${idx})" class="text-rose-500 hover:text-rose-700 font-bold px-1 text-xs">✕</button>
        `;
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
