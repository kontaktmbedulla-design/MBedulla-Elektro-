<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ElektroTrack Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dce3;--blue:#1f5fa8;--go:#1e8a4c;--stop:#c23a2b;--earth1:#d9b300;--earth2:#2e9a4a;--head:#14202b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#e8eef3;--mute:#93a3b2;--line:#2b3a47;--blue:#6aa7e8;--head:#0a1015}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:'Barlow Semi Condensed',system-ui,sans-serif;margin:0}
header{background:var(--head);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .in{max-width:900px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stripe{height:5px;background:repeating-linear-gradient(90deg,var(--earth1) 0 18px,var(--earth2) 18px 36px)}
.logo{font:700 21px 'Barlow Semi Condensed',sans-serif;letter-spacing:.3px}
.lang button{background:transparent;color:#cfd8e0;border:1px solid #3a4a58;padding:4px 9px;border-radius:6px;font:600 12px Barlow;cursor:pointer}
.lang button.on{background:#fff;color:#14202b;border-color:#fff}
main{max-width:900px;margin:auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:18px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px;font-weight:500}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:600 15px Barlow;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.red{background:var(--stop)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.clock{text-align:center;padding:22px 16px}
.timer{font:700 56px/1 'Barlow Semi Condensed',sans-serif;font-variant-numeric:tabular-nums;margin:6px 0}
.big{width:100%;max-width:340px;padding:16px;font:700 22px 'Barlow Semi Condensed',sans-serif;border-radius:10px;border:0;color:#fff;cursor:pointer;background:var(--go)}
.big.stop{background:var(--stop)}
.mute{color:var(--mute);font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.pill.on{background:var(--go);color:#fff;border-color:var(--go)}
.task{border-left:4px solid var(--earth1);background:var(--bg);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:8px}
.task.done{opacity:.55;border-left-color:var(--earth2);text-decoration:line-through}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;border-bottom:1px solid var(--line);padding:8px 6px}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
ul.plain{list-style:none;margin:0;padding:0}ul.plain li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.hide{display:none!important}
@media print{header,.noprint,.tabs{display:none!important}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>

,editSite:'Baustelle bearbeiten',siteName:'Name der Baustelle',lat:'Breitengrad (lat)',lng:'Längengrad (lng)',radius:'Erlaubter Radius (m)',myLoc:'Meinen Standort verwenden',siteNote:'Stelle dich auf die Baustelle und tippe auf "Meinen Standort verwenden" oder gib die Koordinaten manuell ein. Wer außerhalb des Radius startet, wird markiert.',coords:'Koordinaten',noCoords:'keine Koordinaten',confirmSite:'Baustelle löschen?',needTitle:'Benötigtes Material für die kommenden Tage',needBy:'Benötigt am',stOpen:'Offen',stOrdered:'Bestellt',stDelivered:'Geliefert',toOrdered:'Bestellt',toDelivered:'Geliefert',matsTab:'Material',reqs:'Materialanfragen',usedMats:'Verwendetes Material',noReq:'Keine Anfragen.',matHint:'Wird sofort an den Manager gesendet.',matCol:'Material',addr:'Adresse der Baustelle',mapsLink:'Google-Maps-Link (optional)',mapsOk:'Koordinaten aus dem Link übernommen.',mapsNo:'Im Link wurden keine Koordinaten gefunden. Öffne den Ort in Google Maps und kopiere den vollständigen Link oder nutze meinen Standort.',navigate:'Navigation',siteNote2:'Gib die Adresse ein, damit der Mitarbeiter sie in Google Maps öffnen kann. Für die Zonenprüfung füge den Google-Maps-Link ein oder nutze meinen Standort; der erlaubte Radius wird von diesem Punkt aus berechnet.'},

anually. Workers who clock in outside the radius are flagged.',coords:'Coordinates',noCoords:'no coordinates',confirmSite:'Delete this work site?',needTitle:'Materials needed for the coming days',needBy:'Needed by',stOpen:'Open',stOrdered:'Ordered',stDelivered:'Delivered',toOrdered:'Mark ordered',toDelivered:'Mark delivered',matsTab:'Materials',reqs:'Material requests',usedMats:'Materials used',noReq:'No requests.',matHint:'Sent to the manager right away.',matCol:'Material',addr:'Site address',mapsLink:'Google Maps link (optional)',mapsOk:'Coordinates taken from the link.',mapsNo:'No coordinates found in this link. Open the place in Google Maps and copy the full link, or use my location.',navigate:'Navigate',siteNote2:'Enter the address so the worker can open it in Google Maps. For zone checks, paste the Google Maps link or use my location; the allowed radius is measured from that point.'}};
const PROJECTS=['Objekti Banesor - Rruga B','Shtëpia e A. Berishës','Parku Fotovoltaik - Podujevë'];
const KEY='elektrotrack_v1';
const seed=()=>({workers:[{id:1,name:'Agon Berisha',email:'agon@elektro.com',phone:'+38344123456',role:'Electrician',rate:20},{id:2,name:'Driton Gashi',email:'driton@elektro.com',phone:'+38344987654',role:'Electrician',rate:18}],tasks:[{id:1,wid:1,project:PROJECTS[0],text:'Shtrirja e kabllove në katin 2 dhe montimi i tablosë.',done:false,date:today()}],sessions:[],materials:[],nid:10});
function today(){return new Date().toISOString().slice(0,10)}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.workers)S=seed();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let lang='sq',ui={screen:'login',uid:null,tab:'team',edit:null,gps:null,month:today().slice(0,7)};
try{lang=localStorage.getItem('et_lang')||'sq'}catch(e){}
const X={fin:['Ofertat & Faturat','Angebote & Rechnungen','Offers & Invoices'],offers:['Ofertat e objekteve','Angebote je Baustelle','Site offers'],invoices:['Faturat','Rechnungen','Invoices'],newOffer:['Ofertë e re','Neues Angebot','New offer'],client:['Klienti','Kunde','Client'],desc:['Përshkrimi','Beschreibung','Description'],net:['Shuma pa TVSH (€)','Nettobetrag (€)','Net amount (€)'],vat:['TVSH %','MwSt. %','VAT %'],totalEur:['Totali (€)','Gesamt (€)','Total (€)'],oDraft:['Draft','Entwurf','Draft'],oSent:['Dërguar','Gesendet','Sent'],oAccepted:['Pranuar','Angenommen','Accepted'],oRejected:['Refuzuar','Abgelehnt','Rejected'],toInvoice:['→ Faturë','→ Rechnung','→ Invoice'],dueDays:['Afati i pagesës (ditë)','Zahlungsziel (Tage)','Payment term (days)'],issuedAt:['Lëshuar (data dhe ora)','Ausgestellt (Datum, Uhrzeit)','Issued (date and time)'],due:['Afati','Fällig','Due'],iIssued:['Lëshuar','Ausgestellt','Issued'],iPaid:['Paguar','Bezahlt','Paid'],markPaid:['Shëno paguar','Als bezahlt markieren','Mark paid'],sumAccepted:['Ofertat e pranuara','Angenommene Angebote','Accepted offers'],sumOpen:['Faturat e hapura','Offene Rechnungen','Open invoices'],base:['Baza / punishtja','Firmensitz / Werkstatt','Base / workshop'],baseNote:['Distanca llogaritet nga baza te objekti (vijë ajrore × koeficienti i rrugës), vajtje-ardhje.','Entfernung von der Basis zur Baustelle (Luftlinie × Straßenfaktor), Hin- und Rückfahrt.','Distance from base to site (straight line × road factor), round trip.'],factor:['Koeficienti i rrugës','Straßenfaktor','Road factor'],kmRound:['Km (një drejtim · vajtje-ardhje)','Km (einfach · Hin und zurück)','Km (one way · round trip)'],adminOnly:['Vetëm admini','Nur Admin','Admin only']};
const t=k=>L[lang][k]||(X[k]?X[k][{sq:0,de:1,en:2}[lang]]:k);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const net=s=>Math.max(0,((s.end||Date.now())-s.start)/36e5-(s.brk||0)/60);
const fmt=h=>h.toFixed(2)+' h';
const active=wid=>S.sessions.find(s=>s.wid===wid&&!s.end);
const roleName=r=>r==='Manager'?t('mgr'):r==='Helper'?t('helper'):t('electrician');
const siteNames=()=>S.sites.map(s=>s.name),siteOf=n=>S.sites.find(s=>s.name===n);
const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const zone=(p,g)=>{const s=siteOf(p);if(!g||!s||s.lat==null)return{ok:null,d:null};const d=Math.round(dist(g,s));return{ok:d<=s.r,d}};
const zoneTxt=(ok,d,g)=>ok===true?'✔ '+t('inZone')+' ('+d+' m)':ok===false?'⚠ '+t('outZone')+' ('+d+' m)':g?'✔ '+t('gpsOk'):'⚠ '+t('gpsNo');
const gpsCell=(ok,d,g)=>g?(ok===false?`<span style="color:var(--stop);font-weight:600">⚠ ${t('outZone')} (${d} m)</span> `:ok===true?`✔ ${t('inZone')} (${d} m) `:'✔ ')+mapLink(g):'⚠ '+t('gpsNo');
const gpsMini=(g,ok,d,l)=>g?(ok===false?`<span style="color:var(--stop);font-weight:600">⚠ ${mapLink(g,l)} (${d} m)</span>`:(ok===true?'✔ ':'')+mapLink(g,l)+(d!=null?' ('+d+' m)':'')):'⚠ '+l;
const cwOk=s=>!ui.cw||ui.cw==='all'||s.wid===+ui.cw;
const mapLink=(g,l)=>`<a href="https://www.openstreetmap.org/?mlat=${g.lat}&mlon=${g.lng}#map=17/${g.lat}/${g.lng}" target="_blank" rel="noopener">${l||g.lat+', '+g.lng}</a>`;
const wname=id=>(S.workers.find(w=>w.id===id)||{name:'?'}).name;
const sumH=(wid,pred)=>S.sessions.filter(s=>s.wid===wid&&s.end&&pred(s)).reduce((a,s)=>a+net(s),0);
const dkey=ms=>new Date(ms).toISOString().slice(0,10);

function langBar(){$('lang').innerHTML=['sq','de','en'].map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join(' ');document.documentElement.lang=lang}
function setLang(l){lang=l;try{localStorage.setItem('et_lang',l)}catch(e){};render()}

function render(){langBar();const a=$('app');
 if(ui.screen==='login')a.innerHTML=loginView();
 else if(ui.screen==='worker')a.innerHTML=workerView();
 else a.innerHTML=managerView();}

function loginView(){return `<section class="card" style="max-width:420px;margin:24px auto;width:100%"><h2 style="font-size:26px">${t('signin')}</h2><p class="mute">${t('pick')}</p>
<form onsubmit="doLogin(event)"><label>${t('email')}</label><input id="le" type="email" autocomplete="username" required value="${esc(ui.lastEmail||'')}">
<label>${t('password')}</label><input id="lp" type="password" autocomplete="current-password" required>
<p id="lerr" class="mute" style="color:var(--stop);min-height:20px;margin:8px 0" role="alert"></p>
<button class="btn" style="width:100%">${t('enter')}</button></form><p class="mute" style="margin-top:14px">${t('demoCreds')}</p><p class="mute">${t('demoNote')}</p></section>`}
async function H(key,pw){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('et|'+key+'|'+pw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function init(){if(!S.offers)S.offers=[];if(!S.invoices)S.invoices=[];if(!S.cfg)S.cfg={lat:null,lng:null,factor:1.3};if(!S.requests)S.requests=[];if(!S.sites)S.sites=PROJECTS.map((n,i)=>({id:i+1,name:n,lat:null,lng:null,r:150}));if(!S.admin)S.admin={email:'admin@elektro.com'};if(!S.admin.pw)S.admin.pw=await H('admin','admin123');for(const w of S.workers)if(!w.pw)w.pw=await H('w'+w.id,'123456');persist();render()}
async function doLogin(e){e.preventDefault();const em=$('le').value.trim().toLowerCase(),pw=$('lp').value;ui.lastEmail=em;ui.admin=false;let acc=null,mgr=false;
 if(S.admin.email===em&&S.admin.pw===await H('admin',pw)){mgr=true;ui.admin=true}
 else{acc=S.workers.find(w=>w.email.toLowerCase()===em);if(acc&&acc.pw===await H('w'+acc.id,pw)){if(acc.role==='Manager')mgr=true}else acc=null}
 if(!mgr&&!acc){$('lerr').textContent=t('loginErr');$('lp').value='';return}
 if(mgr){ui.screen='manager';ui.tab='live'}else{ui.screen='worker';ui.uid=acc.id}
 render();startTick()}
async function resetPw(id){const w=S.workers.find(x=>x.id===id);if(!w)return;const p=prompt(t('newPw')+' — '+w.name);if(p===null)return;if(p.length<6){alert(t('pwShort'));return}w.pw=await H('w'+w.id,p);persist();alert(t('pwSaved'))}
async function setAdminPw(){const p=$('ap').value;if(p.length<6){alert(t('pwShort'));return}S.admin.pw=await H('admin',p);persist();$('ap').value='';alert(t('pwSaved'))}
function logout(){ui.screen='login';ui.edit=null;render()}

function calendar(){const [Y,M]=ui.month.split('-').map(Number),days=new Date(Y,M,0).getDate(),off=(new Date(Y,M-1,1).getDay()+6)%7,per={};
 S.sessions.filter(s=>s.end&&dkey(s.start).slice(0,7)===ui.month&&cwOk(s)).forEach(s=>{const d=+dkey(s.start).slice(8);per[d]=(per[d]||0)+net(s)});
 let cells='';for(let i=0;i<off;i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){const h=per[d];cells+=`<div style="border:1px solid var(--line);border-radius:6px;padding:4px;min-height:50px;${h?'background:color-mix(in srgb,var(--earth2) 20%,var(--card))':''}"><div class="mute" style="font-size:11px">${d}</div><b style="font-size:12px">${h?h.toFixed(1)+' h':''}</b></div>`}
 const names=[...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(lang,{weekday:'short'}));
 return `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${names.map(n=>`<div class="mute" style="text-align:center;font-size:12px">${n}</div>`).join('')}${cells}</div>`}
function teamTab(){const e=ui.edit!=null?S.workers.find(w=>w.id===ui.edit):null;
 return `<section class="card noprint"><h3>${e?t('editWorker'):t('addWorker')}</h3><div class="row"><div><label>${t('name')}</label><input id="wn" value="${e?esc(e.name):''}"></div><div><label>${t('email')}</label><input id="we" type="email" value="${e?esc(e.email):''}"></div><div><label>${t('phone')}</label><input id="wp" type="tel" value="${e?esc(e.phone):''}"></div><div><label>${t('role')}</label><select id="wr"><option value="Electrician" ${e&&e.role==='Electrician'?'selected':''}>${t('electrician')}</option><option value="Helper" ${e&&e.role==='Helper'?'selected':''}>${t('helper')}</option><option value="Manager" ${e&&e.role==='Manager'?'selected':''}>${t('mgr')}</option></select></div><div><label>${t('rate')}</label><input id="wt" type="number" min="0" value="${e?e.rate:''}"></div><div><label>${t('password')}</label><input id="wpw" type="password" autocomplete="new-password" placeholder="${e?esc(t('pwKeep')):''}"></div></div>
<p><button class="btn" onclick="saveWorker()">${t('save')}</button> ${e?`<button class="btn ghost" onclick="ui.edit=null;render()">${t('cancel')}</button>`:''}</p></section>
<section class="card"><h3>${t('team')}</h3><div class="scroll"><table><tr><th>${t('name')}</th><th>${t('phone')}</th><th>${t('status')}</th><th class="noprint">${t('actions')}</th></tr>${S.workers.map(w=>`<tr><td><b>${esc(w.name)}</b><div class="mute">${roleName(w.role)} · ${esc(w.email)}</div></td><td>${esc(w.phone)}</td><td><span class="pill ${active(w.id)?'on':''}">${active(w.id)?t('onSite'):t('off')}</span></td><td class="noprint"><button class="btn sm ghost" onclick="ui.edit=${w.id};render();scrollTo(0,0)">${t('edit')}</button> <button class="btn sm ghost" onclick="resetPw(${w.id})">🔑 ${t('password')}</button> <button class="btn sm red" onclick="delWorker(${w.id})">${t('del')}</button></td></tr>`).join('')}</table></div></section>`}
async function saveWorker(){const name=$('wn').value.trim(),email=$('we').value.trim(),phone=$('wp').value.trim(),pw=$('wpw').value;if(!name||!email||!phone)return;
 if((ui.edit==null&&pw.length<6)||(pw&&pw.length<6)){alert(t('pwShort'));return}
 const d={name,email,phone,role:$('wr').value,rate:parseFloat($('wt').value)||0};
 let w;if(ui.edit!=null){w=S.workers.find(x=>x.id===ui.edit);Object.assign(w,d)}else{w={id:S.nid++,...d};S.workers.push(w)}
 if(pw)w.pw=await H('w'+w.id,pw);
 ui.edit=null;persist();render()}
function delWorker(id){if(!confirm(t('confirmDel')))return;S.workers=S.workers.filter(w=>w.id!==id);['tasks','sessions','materials'].forEach(k=>S[k]=S[k].filter(x=>x.wid!==id));persist();render()}
function tasksTab(){const list=S.tasks.slice().reverse().slice(0,15);
 return `<section class="card"><h3>${t('assign')}</h3><div class="row"><div><label>${t('worker')}</label><select id="tw">${S.workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div><div><label>${t('project')}</label><select id="tp">${siteNames().map(p=>`<option>${esc(p)}</option>`).join('')}</select></div></div><label>${t('taskText')}</label><textarea id="tt" rows="3"></textarea><p><button class="btn" onclick="assignTask()">${t('send')}</button> <span id="tmsg" class="mute"></span></p></section>
<section class="card">${list.length?list.map(k=>`<div class="task ${k.done?'done':''}"><b>${esc(wname(k.wid))}</b> · ${esc(k.project)} <span class="mute">${k.date}</span><br>${esc(k.text)}</div>`).join(''):`<p class="mute">${t('empty')}</p>`}</section>`}
function assignTask(){const text=$('tt').value.trim();if(!text||!S.workers.length)return;S.tasks.push({id:S.nid++,wid:parseInt($('tw').value),project:$('tp').value,text,done:false,date:today()});persist();render();$('tmsg').textContent=t('sent')}
function sheetTab(){const m=ui.month,inM=s=>dkey(s.start).slice(0,7)===m;
 const rows=S.workers.map(w=>{const h=sumH(w.id,inM);return{w,h,c:h*w.rate,km:kmMonth(w.id,m)}});
 const tH=rows.reduce((a,r)=>a+r.h,0),tC=rows.reduce((a,r)=>a+r.c,0);
 const ses=S.sessions.filter(s=>s.end&&inM(s)&&cwOk(s)).sort((a,b)=>b.start-a.start);
 return `<section class="card"><div class="between"><h3 style="margin:0">${t('sheet')}</h3><div class="row noprint" style="flex:0 1 auto"><input type="month" value="${m}" onchange="ui.month=this.value;render()"><button class="btn" onclick="window.print()">${t('export')}</button></div></div>
<div class="scroll"><table style="margin-top:10px"><tr><th>${t('worker')}</th><th>${t('hours')}</th><th>${t('rate')}</th><th>${t('cost')}</th><th>Km ↔</th></tr>${rows.map(r=>`<tr><td>${esc(r.w.name)}</td><td>${fmt(r.h)}</td><td>${r.w.rate} €</td><td>${r.c.toFixed(2)} €</td><td>${r.km.toFixed(1)} km</td></tr>`).join('')}<tr><td><b>${t('total')}</b></td><td><b>${fmt(tH)}</b></td><td></td><td><b>${tC.toFixed(2)} €</b></td><td><b>${rows.reduce((a,r)=>a+r.km,0).toFixed(1)} km</b></td></tr></table></div></section>
<section class="card"><div class="between"><h3 style="margin:0">${t('sheet')}</h3><select class="noprint" style="width:auto" onchange="ui.cw=this.value;render()"><option value="all">${t('all')}</option>${S.workers.map(w=>`<option value="${w.id}" ${ui.cw==w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div style="margin-top:10px">${calendar()}</div></section>
<section class="card"><h3>${t('sessions')}</h3>${ses.length?`<div class="scroll"><table><tr><th>${t('date')}</th><th>${t('worker')}</th><th>${t('project')}</th><th>${t('from')}–${t('to')}</th><th>${t('gross')}</th><th>${t('brk')}</th><th>${t('hours')}</th><th>GPS</th></tr>${ses.map(s=>`<tr><td>${dkey(s.start)}</td><td>${esc(wname(s.wid))}</td><td>${esc(s.project)}</td><td>${new Date(s.start).toTimeString().slice(0,5)}–${new Date(s.end).toTimeString().slice(0,5)}</td><td>${fmt((s.end-s.start)/36e5)}</td><td>${s.brk||0} min</td><td><b>${fmt(net(s))}</b></td><td>${gpsMini(s.gps,s.ok,s.dist,t('ci'))}<br>${gpsMini(s.gpsOut,s.okOut,s.distOut,t('co'))}</td></tr>`).join('')}</table></div>`:`<p class="mute">${t('empty')}</p>`}</section>`}
function resetDemo(){S=seed();init()}

let tick;function startTick(){clearInterval(tick);tick=setInterval(()=>{document.querySelectorAll('[data-since]').forEach(x=>x.textContent=clockStr(Date.now()-x.dataset.since));netPrev();ui.tc=(ui.tc||0)+1;if(ui.screen==='manager'&&ui.tab==='live'&&ui.tc%5===0)render();const el=$('timer');if(el&&ui.screen==='worker'){const a=active(ui.uid);if(a)el.textContent=clockStr(Date.now()-a.start)}},1000)}
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{S=JSON.parse(e.newValue)}catch(x){return}if(ui.screen==='manager'&&(ui.tab==='live'||ui.tab==='sheet'))render()});
init();
</script>
</body>
</html>
